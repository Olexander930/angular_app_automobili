<div class="form-container">
  <h2>Додати новий автомобіль</h2>

  <form [formGroup]="carForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Бренд:</label>
      <input formControlName="brand" placeholder="Наприклад: BMW" />
      <p class="error" *ngIf="carForm.get('brand')?.touched && carForm.get('brand')?.hasError('required')">
        Вкажіть бренд!
      </p>
    </div>

    <div class="form-group">
      <label>Модель:</label>
      <input formControlName="model" placeholder="Наприклад: X5" />
      <p class="error" *ngIf="carForm.get('model')?.touched && carForm.get('model')?.hasError('required')">
        Вкажіть модель!
      </p>
    </div>

    <div class="form-group">
      <label>Рік випуску:</label>
      <input formControlName="year" placeholder="Наприклад: 2018" class="no-spin" />
      <p class="error" *ngIf="carForm.get('year')?.touched && carForm.get('year')?.hasError('required')">
        Вкажіть рік випуску (мінімум 1990)!
      </p>
    </div>

    <div class="form-group">
      <label>Ціна:</label>
      <input formControlName="price" placeholder="Наприклад: 15000" class="no-spin" />
      <p class="error" *ngIf="carForm.get('price')?.touched && carForm.get('price')?.hasError('required')">
        Вкажіть ціну (більше 1000)!
      </p>
    </div>

    <div class="form-group">
      <label>Колір:</label>
      <input formControlName="color" placeholder="Наприклад: Чорний" />
      <p class="error" *ngIf="carForm.get('color')?.touched && carForm.get('color')?.hasError('required')">
        Вкажіть колір!
      </p>
    </div>

    <div class="form-group">
      <label>Двигун:</label>
      <input formControlName="engine" placeholder="Наприклад: 2.0 дизель" />
      <p class="error" *ngIf="carForm.get('engine')?.touched && carForm.get('engine')?.hasError('required')">
        Вкажіть тип двигуна!
      </p>
    </div>

    <div class="form-group">
      <label>Коробка передач:</label>
      <input formControlName="transmission" placeholder="Наприклад: Автомат" />
      <p class="error" *ngIf="carForm.get('transmission')?.touched && carForm.get('transmission')?.hasError('required')">
        Вкажіть коробку передач!
      </p>
    </div>

    <div class="form-group">
      <label>Витрата пального:</label>
      <input formControlName="fuelConsumption" placeholder="Наприклад: 7.5 л/100 км" />
      <p class="error" *ngIf="carForm.get('fuelConsumption')?.touched && carForm.get('fuelConsumption')?.hasError('required')">
        Вкажіть витрату пального!
      </p>
    </div>

    <button type="submit" [disabled]="carForm.invalid" class="submit-btn">Додати авто</button>
    <a routerLink="/cars" class="back-btn">Назад</a>
  </form>
</div>

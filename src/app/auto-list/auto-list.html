<div class="container">
  <h2 class="title">Список автомобілів</h2>

  <div class="search-container">
    <input
      type="text"
      placeholder="Пошук за брендом або моделлю..."
      [(ngModel)]="searchText"
      (input)="searchCars()"
      class="search-input"
    />
    <button (click)="searchCars()" class="search-button">Пошук</button>
    <button (click)="clearSearch()" class="clear-button">Очистити</button>
  </div>

  <div class="cars">
    <app-auto-card
      *ngFor="let car of cars"
      [car]="car"
      (select)="onCarSelected($event)">
    </app-auto-card>
  </div>

  <div *ngIf="cars.length === 0" class="no-results">
    Немає автомобілів за вашим запитом.
  </div>
</div>

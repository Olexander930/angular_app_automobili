<div class="container">
  <div class="header-row">
    <h2 class="title">Список автомобілів</h2>
    <a routerLink="/add-auto" class="add-btn">Додати авто</a>
  </div>

  <div class="search-container">
    <input
      type="text"
      placeholder="Пошук за брендом або моделлю..."
      [(ngModel)]="searchText"
      (input)="searchCars()"
      class="search-input"
    />
    <button (click)="searchCars()" class="search-button">Пошук</button>
    <button (click)="clearSearch()" class="clear-button">Очистити</button>
  </div>

  <div class="cars">
    <app-auto-card
      *ngFor="let car of (cars$ | async)"
      [car]="car"
      (select)="onCarSelected($event)">
    </app-auto-card>
  </div>

  <div *ngIf="(cars$ | async)?.length === 0" class="no-results">
    Немає автомобілів за вашим запитом.
  </div>
</div>
